databaseChangeLog:
  - changeSet:
      id: 007-create-reviews
      author: dyachkova
      changes:
        - createTable:
            tableName: reviews
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reviews_user
                    references: users(id)
              - column:
                  name: tour_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reviews_tour
                    references: tours(id)
              - column:
                  name: rating
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: varchar(4000)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: reviews
            columnNames: user_id, tour_id
            constraintName: uk_reviews_user_tour
