databaseChangeLog:
  - changeSet:
      id: 004-create-transports
      author: dyachkova
      changes:
        - createTable:
            tableName: transports
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: model
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: plate_number
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: seats
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transports_owner
                    references: users(id)
