databaseChangeLog:
  - changeSet:
      id: 006-create-trips
      author: dyachkova
      changes:
        - createTable:
            tableName: trips
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tour_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trips_tour
                    references: tours(id)
              - column:
                  name: transport_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trips_transport
                    references: transports(id)
              - column:
                  name: departure_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
