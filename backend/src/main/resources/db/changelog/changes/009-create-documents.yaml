databaseChangeLog:
  - changeSet:
      id: 009-create-documents
      author: dyachkova
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trip_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_documents_trip
                    references: trips(id)
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_documents_owner
                    references: users(id)
              - column:
                  name: file_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: file_type
                  type: varchar(100)
              - column:
                  name: file_path
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
