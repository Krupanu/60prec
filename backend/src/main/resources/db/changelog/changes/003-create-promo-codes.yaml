databaseChangeLog:
  - changeSet:
      id: 003-create-promo-codes
      author: dyachkova
      changes:
        - createTable:
            tableName: promo_codes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: discount_percent
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: valid_from
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: valid_to
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: max_uses
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: used_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
